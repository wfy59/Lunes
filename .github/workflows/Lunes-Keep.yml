name: Lunes Host 自动保活

on:
  schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    - cron: '12 4 1,11,21 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: 执行保活
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: lunes-keepalive
      cancel-in-progress: false

    steps:
      - name: 记录开始时间
        run: echo "START_TS=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="❌ Lunes Host 自动保活失败：代理不可用" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行保活
        env:
          LUNES: ${{ secrets.LUNES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/Lunes-Keep.py

      - name: 写入本次运行时间并推送
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          TZ=Asia/Shanghai
          export TZ
          END_TS=$(date +%s)
          START_TS=${START_TS:-$END_TS}
          DURATION=$((END_TS - START_TS))
          START_LOCAL=$(date -d "@$START_TS" +"%Y-%m-%d %H:%M:%S")
          END_LOCAL=$(date -d "@$END_TS" +"%Y-%m-%d %H:%M:%S")

          cat > run_time.txt <<EOF
          最近一次运行
          开始时间: ${START_LOCAL} (Asia/Shanghai)
          结束时间: ${END_LOCAL} (Asia/Shanghai)
          耗时: ${DURATION} 秒
          结果: ${JOB_STATUS}
          运行编号: ${{ github.run_number }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_time.txt
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新最近一次运行时间 [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 清理旧运行
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3